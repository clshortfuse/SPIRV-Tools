name: Fork upstream sync and binaries

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fork-binaries.yml'

permissions:
  contents: read

concurrency:
  group: fork-upstream-binaries
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'clshortfuse/SPIRV-Tools' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upstream_sha: ${{ steps.release.outputs.upstream_sha }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      - name: Merge upstream main into fork
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/KhronosGroup/SPIRV-Tools.git
          git fetch --no-tags upstream main
          upstream_sha=$(git rev-parse FETCH_HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$upstream_sha"
          git push origin HEAD:main
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
      - name: Select latest numbered upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_releases=$(gh release list --repo KhronosGroup/SPIRV-Tools --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName)
          version=$(jq -r '.[].tagName | select(test("^v[0-9]{4}\\.[0-9]+$"))' <<< "$upstream_releases" | sort -V | tail -n 1)
          test -n "$version"
          git fetch --no-tags upstream "+refs/tags/$version:refs/upstream-tags/$version"
          upstream_sha=$(git rev-parse "refs/upstream-tags/$version^{commit}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          releases=$(gh release list --limit 1000 --json tagName,isDraft)
          if jq -e --arg tag "$version" '.[] | select(.tagName == $tag and .isDraft == false)' <<< "$releases" > /dev/null; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: KhronosGroup/SPIRV-Tools
          ref: ${{ needs.sync.outputs.upstream_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream-pinned headers
        run: python utils/git-sync-deps --prefix external/spirv-headers
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF -DSPIRV_TOOLS_USE_MIMALLOC=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Install
        run: cmake --install build --config Release --prefix package
      - name: Make pkg-config metadata relocatable
        shell: python {0}
        run: |
          from pathlib import Path

          for path in Path('package').rglob('*.pc'):
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              for index, line in enumerate(lines):
                  if line.startswith('prefix='):
                      lines[index] = 'prefix=${pcfiledir}/../..\n'
              path.write_text(''.join(lines), encoding='utf-8')
      - name: Smoke test and package
        shell: bash
        env:
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          VERSION: ${{ needs.sync.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          package/bin/spirv-val --version
          package/bin/spirv-opt --version
          cp LICENSE package/LICENSE
          printf 'Unofficial build\nVersion: %s\nUpstream: https://github.com/KhronosGroup/SPIRV-Tools/commit/%s\nPlatform: %s\n' "$VERSION" "$UPSTREAM_SHA" "$PLATFORM" > package/BUILD-INFO.txt
          cmake -E tar cf "SPIRV-Tools-$PLATFORM.zip" --format=zip -- package
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: SPIRV-Tools-${{ matrix.platform }}.zip
          if-no-files-found: error

  publish:
    needs: [sync, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          VERSION: ${{ needs.sync.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$VERSION"
          for platform in windows-x64 linux-x64 macos-x64; do
            test -f "SPIRV-Tools-$platform.zip"
          done
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$UPSTREAM_SHA" --draft --title "SPIRV-Tools $VERSION" --notes "Unofficial binaries for upstream numbered release $VERSION: https://github.com/KhronosGroup/SPIRV-Tools/tree/$VERSION (commit $UPSTREAM_SHA). These are not official Khronos or Vulkan SDK binaries."
          fi
          gh release upload "$tag" SPIRV-Tools-*.zip --clobber
          gh release edit "$tag" --draft=false --latest